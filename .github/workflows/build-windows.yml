name: Build and release ORS for Windows

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.15.2 (64-bit)
        uses: actions/setup-python@v7
        with:
          python-version: "3.15.2"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-dev.txt

      - name: Verify Python runtime and native dependencies
        run: python scripts/verify_environment.py --python-series 3.15

      - name: Run automated test suite
        run: python -m pytest -q

      - name: Build self-contained application folder
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --name ORS-Studio
          --paths backend --add-data "frontend;frontend"
          --collect-all numpy --collect-all scipy --collect-all pandas --collect-all openpyxl
          --collect-all xlsxwriter --collect-all reportlab --collect-all fastapi
          --collect-all uvicorn --collect-all starlette --collect-all pydantic
          --collect-all pydantic_core --collect-all multipart run_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile one-click Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "installer\ORS-Studio.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "ORS-Studio-Setup-0.4.0.exe")) { throw "Installer output was not created" }

      - name: Create portable ZIP and checksum manifest
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ORS-Studio\*" -DestinationPath "ORS-Studio-Windows-x64-0.4.0.zip" -CompressionLevel Optimal
          $files = @("ORS-Studio-Setup-0.4.0.exe", "ORS-Studio-Windows-x64-0.4.0.zip")
          $hashes = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLower())  $file"
          }
          $hashes | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ORS-Studio-Windows-x64-0.4.0
          path: |
            ORS-Studio-Setup-0.4.0.exe
            ORS-Studio-Windows-x64-0.4.0.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" `
              "ORS-Studio-Setup-0.4.0.exe" `
              "ORS-Studio-Windows-x64-0.4.0.zip" `
              "SHA256SUMS.txt" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update existing release assets" }
            gh release edit "$env:RELEASE_TAG" --title "ORS Studio $env:RELEASE_TAG" --latest
          } else {
            gh release create "$env:RELEASE_TAG" `
              "ORS-Studio-Setup-0.4.0.exe" `
              "ORS-Studio-Windows-x64-0.4.0.zip" `
              "SHA256SUMS.txt" `
              --title "ORS Studio $env:RELEASE_TAG" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
