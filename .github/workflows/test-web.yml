name: Test ORS public web edition

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-latest
    env:
      ORS_ENV: development
      ORS_SESSION_SECRET: test-only-session-pepper
      DATABASE_URL: sqlite://
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-web.txt pytest httpx
      - run: python -m compileall -q backend
      - run: python -m pytest -q
      - name: Verify Netlify API proxy generation
        shell: bash
        run: |
          mkdir -p /tmp/ors-netlify-publish
          cp frontend/index.html /tmp/ors-netlify-publish/index.html
          ORS_API_ORIGIN=https://ors-api.example.up.railway.app NETLIFY_PUBLISH_DIR=/tmp/ors-netlify-publish bash scripts/netlify-build.sh
          grep -F '/api/* https://ors-api.example.up.railway.app/api/:splat 200!' /tmp/ors-netlify-publish/_redirects
          if ORS_API_ORIGIN=http://insecure.example NETLIFY_PUBLISH_DIR=/tmp/ors-netlify-publish bash scripts/netlify-build.sh; then
            echo "Insecure ORS_API_ORIGIN was incorrectly accepted." >&2
            exit 1
          fi
      - name: Validate Netlify and Railway TOML
        run: python -c "import tomllib; tomllib.load(open('netlify.toml', 'rb')); tomllib.load(open('railway.toml', 'rb')); print('Deployment TOML files are valid.')"
