services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ors
      POSTGRES_USER: ors
      POSTGRES_PASSWORD: ors-dev-only
    ports: ["5432:5432"]
    volumes: ["ors-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ors -d ors"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ORS_ENV: development
      ORS_SESSION_SECRET: local-development-only-change-me
      ORS_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql+psycopg://ors:ors-dev-only@postgres:5432/ors
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build:
      context: .
      dockerfile: Dockerfile.web
    command: ["sh", "-c", "rq worker --url $REDIS_URL ors-analysis"]
    environment:
      ORS_ENV: development
      ORS_SESSION_SECRET: local-development-only-change-me
      DATABASE_URL: postgresql+psycopg://ors:ors-dev-only@postgres:5432/ors
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  ors-postgres:
