[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c 'alembic upgrade head && exec uvicorn orstudio.web_api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*'"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
