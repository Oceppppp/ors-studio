services:
  - type: web
    name: ors-studio-web
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements-web.txt
    startCommand: alembic upgrade head && uvicorn orstudio.web_api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: ORS_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ORS_COOKIE_SECURE
        value: "true"
      - key: ORS_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ors-studio-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ors-studio-redis
          property: connectionString
      - key: ORS_QUEUE_WORKERS
        value: "2"

  - type: worker
    name: ors-studio-worker
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    numInstances: 2
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements-web.txt
    startCommand: rq worker --url $REDIS_URL ors-analysis
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: ORS_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: ors-studio-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ors-studio-redis
          property: connectionString

  - type: cron
    name: ors-studio-guest-cleanup
    runtime: python
    region: singapore
    schedule: "0 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements-web.txt
    startCommand: python -m orstudio.cleanup_guests
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        fromDatabase:
          name: ors-studio-postgres
          property: connectionString

  - type: keyvalue
    name: ors-studio-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    persistenceMode: journal-snapshot

databases:
  - name: ors-studio-postgres
    region: singapore
    plan: 0.5c-1g
    databaseName: ors_studio
    user: ors_app
    postgresMajorVersion: "17"
    ipAllowList: []
